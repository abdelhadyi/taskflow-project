name: api gateway pipeline
on:
  workflow_dispatch:
  pull_request:
    branches: 
      - main
    paths: 
      - 'src/api-gateway/**'

env:
  AWS_REGION: us-east-1

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup-node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: src/api-gateway/package-lock.json

    - name: lint-test-build
      run: |
        npm install 
        npm run lint
        npm test
        npm run build
      working-directory: src/api-gateway
  
  SonarQube:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: checkout
      uses: actions/checkout@v4
      
    - name: Quality-gate-SonarCloude
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=taskflow-project
          -Dsonar.projectKey=abdelhadyi_taskflow-project
          -Dsonar.projectBaseDir=src/api-gateway
          -Dsonar.qualitygate.wait=true
  
  Build-scan-push:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: checkout
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build image
      run: |
        cd src/api-gateway
        docker build -t ${{ secrets.ACC_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/taskflow-apigateway:${{ github.run_id }} .
        docker push ${{ secrets.ACC_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/taskflow-apigateway:${{ github.run_id }}
    
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.ACC_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/taskflow-apigateway:${{ github.run_id }}
        severity: CRITICAL
        exit-code: 1
    
    - name: Push image to Amazon ECR
      run: |
        cd src/api-gateway
        docker push ${{ secrets.ACC_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/taskflow-apigateway:${{ github.run_id }}
  
  update-image:
    runs-on: ubuntu-latest
    needs: Build-scan-push
    steps:
    - name: checkout
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_TOKEN }}
        ref: ${{ github.head_ref }}

    - name: update-deployment
      run: |
        sed -i "s|image: .*|image: ${{ secrets.ACC_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/taskflow-apigateway:${{ github.run_id }}|g" kubernetes/api-gateway-svc/deploy.yaml

    - name: git
      run: |
        git config --local user.email "abdelhady.elsayedd@gmail.com"
        git config --local user.name "abdelhadyi"
        git add kubernetes/api-gateway-svc/deploy.yaml
        git commit -a -m "updating the image version to ${{ github.run_id }} [skip ci]"
        git push origin ${{ github.head_ref }}
